back{padding:12px;margin:10px 0;background:#fff1d7;border-radius:12px;line-height:1.7}.feedback.ok{background:#d7f5e4}.task{border-left:4px solid #f2b14a;background:#fff7e8;border-radius:8px;padding:12px 14px;line-height:1.8}.note{border-left:4px solid #23a7a4;background:#edfafa;border-radius:8px;padding:10px 12px;line-height:1.8}textarea,input[type=text]{width:100%;border:1px solid #bdd4d8;border-radius:11px;padding:10px;color:#234753;background:white}textarea{min-height:90px;resize:vertical}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tabs .btn.selected{background:#145768;color:white}.teacher-step{border-left:3px solid #48a7ac;padding:8px 11px;margin:10px 0;background:#f4fafa}.teacher-step b{display:block}.footer{font-size:12px;color:#72888d;line-height:1.6;margin-top:14px}details{border:1px solid #d3e6e6;padding:11px;border-radius:12px;margin:10px 0;background:white}summary{font-weight:800;cursor:pointer}.screen-reader{position:absolute;left:-9999px}.confetti{font-size:40px;text-align:center;padding:9px}.notice{background:#fff4d9;border:1px solid #f3d9a1;padding:10px;border-radius:10px;font-size:13px;line-height:1.6}#toast{position:fixed;bottom:16px;right:16px;max-width:330px;background:#143e4f;color:#fff;padding:12px 18px;border-radius:12px;z-index:7;box-shadow:0 8px 22px #0003;display:none}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}.twocol .btn{font-size:13px}@media(max-width:920px){.main{grid-template-columns:1fr;height:auto}.world{height:54dvh;min-height:360px}.side{overflow:visible;border-left:0;border-top:1px solid #d8e4e5}.side-inner{padding:17px}.topbar{align-items:flex-start}.world-tips{font-size:12px;max-width:230px}}@media(max-width:540px){.brand small{display:none}.topbar{padding:10px}.head-actions .btn{padding:8px;font-size:12px}.brand b{font-size:16px}.world{height:46dvh;min-height:340px}.badgebar{right:10px;top:10px;font-size:12px}.world-controls{bottom:8px;left:8px}.world-controls .btn{padding:8px 10px;font-size:12px}.world-tips{top:52px;left:9px;padding:8px;font-size:11px}.side h1{font-size:25px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="shell"><header class="topbar"><div class="brand"><span class="brandmark">🏝️</span><div><b>物權微縮島</b><small>高一公民｜所有權的物權特性</small></div></div><div class="head-actions"><button id="studentBtn" class="btn mini primary">🧑‍🎓 學生</button><button id="teacherBtn" class="btn mini dark">🧑‍🏫 教師</button><button id="exportTop" class="btn mini">⬇️ 匯出紀錄</button></div></header><main class="main"><section class="world" aria-label="可互動的 3D 物權知識島"><canvas id="scene" aria-label="3D 微縮島：拖曳旋轉，點選建築進入任務。也可以在右側任務清單操作。"></canvas><div class="world-tips">🖱️ 拖曳旋轉視角、滾輪縮放、點選建築導覽<br>📱 手指拖曳旋轉、雙指縮放，也可用下方按鈕</div><div class="badgebar" id="badgebar">完成 0 / 7 區</div><div class="world-controls"><button class="btn mini" id="left" aria-label="向左旋轉">↶ 左轉</button><button class="btn mini" id="right" aria-label="向右旋轉">↷ 右轉</button><button class="btn mini" id="zoomIn">＋ 放大</button><button class="btn mini" id="zoomOut">－ 縮小</button><button class="btn mini" id="resetCam">⌂ 全島</button></div></section><aside class="side"><div class="side-inner" id="panel" aria-live="polite"></div></aside></main></div><div id="toast" role="status"></div>
<script>
'use strict';
const missions=[
{id:'ownership',name:'所有權廣場',icon:'🏛️',sub:'什麼是所有權？',color:'#efc57c',x:-230,z:-135,source:'第 1–2 頁（教材頁碼 109–110）',concept:'所有權人可以使用、收益、處分所有物，並排除他人干涉。憲法第 15 條保障人民財產權，但財產權並非毫無限制。',task:'請舉出你擁有的一項物品，分別寫出「使用、收益、處分」的生活例子。',questions:[{q:'「把自己的腳踏車賣給同學」最直接體現哪一項權能？',opts:['處分','收益','僅是保管'],a:0,why:'出售是將物品移轉給他人的處分行為。'},{q:'依教材，所有權的法律保障是？',opts:['永遠不能受到限制','受到法律保障，但得基於公共利益依法限制','只有土地才有所有權'],a:1,why:'教材指出憲法保障財產權，但公共利益下得依法限制。'}]},
{id:'features',name:'四特性研究院',icon:'🏫',sub:'直接支配、絕對、排他、優先',color:'#afc0f1',x:0,z:-220,source:'第 3–4 頁（111–112）',concept:'所有權有直接支配性、保護絕對性、排他性、優先性。共有是多人共享同一所有權；物權優先於債權，仍須注意法律例外。',task:'以「借出的筆電」為例，解釋直接支配性與保護絕對性有何不同。',questions:[{q:'兩位家人共同擁有一臺電腦，符合哪個說法？',opts:['有兩個互相獨立的所有權','數人共有同一所有權','所有權因此消失'],a:1,why:'教材說明一物一所有權，但可由多人共有。'},{q:'「可以向任何人主張自己的所有權」對應？',opts:['保護絕對性','僅債權相對性','不動產登記'],a:0,why:'所有權屬對世的絕對權。'}]},
{id:'market',name:'電腦交易所',icon:'🏪',sub:'契約與所有權的優先',color:'#f7a7a0',x:232,z:-125,source:'第 4 頁（112）圖 5-2-3',concept:'教材案例：小辰先與元元約定以 5,000 元買賣電腦，之後卻以 6,000 元賣給阿庭並交付。依案例設定，阿庭取得所有權；元元不得僅因先約定就主張電腦屬於自己。',task:'分別站在元元與阿庭的立場，寫出可能的權益爭議與合理處理方式。',questions:[{q:'依教材設定，電腦已交付阿庭，誰取得該電腦所有權？',opts:['元元，因為先約定','阿庭，因為已交付並取得物權','兩人各有一個所有權'],a:1,why:'教材以動產交付後物權優先於在先債權的情境說明；元元的契約權益仍可能需另行處理。'},{q:'元元與小辰先成立買賣契約，最貼近下列何者？',opts:['對特定相對人主張的債權關係','一定已取得動產所有權','契約一定無效'],a:0,why:'債權具有相對性，買賣契約與所有權移轉並非同一概念。'}]},
{id:'remedy',name:'權利救濟所',icon:'⚖️',sub:'民法 767 條三種請求',color:'#bba6ec',x:282,z:95,source:'第 5 頁（113）',concept:'所有物返還請求權：他人無權占有或侵奪；妨害除去請求權：現存妨害；妨害防止請求權：妨害之虞。個案仍需確認事實與法律要件。',task:'設計一個校園借物糾紛，分辨「無權占有」「已發生妨害」「可能妨害」三種情境。',questions:[{q:'有人無權占有你的筆電並拒絕歸還，最直接是哪項請求權？',opts:['所有物返還請求權','妨害防止請求權','智慧財產權'],a:0,why:'民法第 767 條規定，對無權占有或侵奪所有物者可請求返還。'},{q:'鄰居的設備正在妨害你使用自己的土地，應優先辨識？',opts:['妨害除去請求權','所有物返還請求權','買賣契約解除'],a:0,why:'妨害已存在且未必構成無權占有，可考慮除去妨害。'}]},
{id:'registry',name:'土地登記所',icon:'🏠',sub:'動產交付與不動產登記',color:'#9ad5af',x:120,z:238,source:'第 6 頁（114）',concept:'教材介紹物權法定主義（物權除依法律或習慣外，不得創設）、不動產物權變動原則上須登記；動產讓與原則上以交付為公示與生效要件。',task:'比較「買手機」與「買房屋」，整理契約、交付、登記在兩種交易中的作用。',questions:[{q:'陳太太將房屋賣給林先生，依教材案例，正式移轉房屋所有權的關鍵是？',opts:['只有口頭同意','移轉登記','交付鑰匙就一定完成'],a:1,why:'教材以民法第 758 條說明不動產物權變動之登記要件。'},{q:'物權法定主義的意思是？',opts:['可由任何人自創新物權','物權除依法律或習慣外不得創設','只有政府能擁有物品'],a:1,why:'直接對應教材對物權法定主義的說明。'}]},
{id:'public',name:'公共利益公園',icon:'🌳',sub:'所有權的限制與社會責任',color:'#83cfbf',x:-125,z:218,source:'第 2、7 頁（110、115）',concept:'教材以河川汙染、騎樓供行人通行說明私有財產權與公共利益需要調和。限制權利須具有法律依據與正當程序，不能逕認私有物可以任意使用。',task:'以騎樓堆放私人物品為案例，提出兼顧所有人需求與行人通行的方案。',questions:[{q:'教材以騎樓作為什麼的例子？',opts:['私人所有權永遠優於公共利益','私有財產與公共通行利益的調和','任何人都可任意占用私地'],a:1,why:'騎樓反映財產使用與公共通行的利益衡平。'},{q:'所有權人排放廢水造成河川汙染，最合乎教材意旨的做法？',opts:['只要是自己的土地就無限制','以法律規範及管理減少環境公害','國家不需介入'],a:1,why:'教材強調避免所有權行使對他人產生負面影響。'}]},
{id:'forum',name:'創作公民論壇',icon:'💡',sub:'智慧財產與合理使用',color:'#f2d08c',x:-294,z:77,source:'第 7 頁（115）公民論壇',concept:'智慧財產權鼓勵創作，也必須兼顧公共利益與知識傳播；教材提出開放原始碼、合理使用及著作權保護間的討論。注意：智慧財產權不是本單元所稱「有形物所有權」的同義詞。',task:'討論：「為教學分享網路圖片」是否一定可以自由使用？提出至少兩項應查核的條件。',questions:[{q:'智慧財產權制度需要兼顧？',opts:['只保障創作者、完全不管公共利益','創作者權益與公共利益','只要網路上找到就可任意使用'],a:1,why:'教材引著作權法第 1 條，強調調和社會公共利益。'},{q:'「開放原始碼」代表？',opts:['所有程式都自動無著作權','可依其授權條件檢視、使用或修改程式碼','任何用途皆不必理會授權'],a:1,why:'開放原始碼不等於放棄著作權；實際利用仍須遵守授權條件。'}]}
];
const key='civic-property-island-v1';let store={done:[],answers:{},notes:{},student:'',mode:'student',selected:0};try{Object.assign(store,JSON.parse(localStorage.getItem(key)||'{}'))}catch{}if(!Array.isArray(store.done))store.done=[];if(!store.notes)store.notes={};const save=()=>{try{localStorage.setItem(key,JSON.stringify(store))}catch{}};const $=id=>document.getElementById(id);let feedback='';const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const unlocked=i=>store.mode==='teacher'||i===0||store.done.includes(missions[i-1].id)||store.done.includes(missions[i].id);function toast(s){const a=$('toast');a.textContent=s;a.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>a.style.display='none',2800)}
function selectMission(i){if(!unlocked(i)){toast('🔒 請先完成前一區的任務解鎖');return}store.selected=i;feedback='';cameraTarget.x=missions[i].x;cameraTarget.z=missions[i].z;cameraTarget.zoom=1.27;save();renderPanel()}
function intro(){return `<div class="eyebrow">EXPLORE · LEARN · UNLOCK</div><h1>探索你的物權知識島</h1><p>這座低多邊形立體島嶼將教材拆成 <b>7 座可探索建築</b>。學生依序解鎖任務，教師可切換教學模式自由導覽。</p><div class="stat"><span>🏅 已解鎖成就 <b>${store.done.length}/7</b></span><span>📖 高一公民</span></div><div class="progress"><i style="width:${Math.round(store.done.length/7*100)}%"></i></div><label for="studentName">學習者姓名／座號（選填）</label><input id="studentName" type="text" maxlength="60" placeholder="例如：101 班 01 號" value="${escapeHTML(store.student)}"><h2>任務地圖</h2>${missions.map((m,i)=>`<button class="mission-card ${store.selected===i?'active':''}" data-mission="${i}"><span class="emoji">${m.icon}</span><span><b>${i+1}. ${m.name}</b><small>${m.sub}</small></span><span class="chip ${store.done.includes(m.id)?'done':unlocked(i)?'':'lock'}">${store.done.includes(m.id)?'✓ 完成':unlocked(i)?'探索':'🔒'}</span></button>`).join('')}<div class="notice">💡 請先閱讀案例，再作答兩道題目。兩題皆正確即可解鎖下一站。文字反思可隨時編輯，會儲存在目前瀏覽器。</div><div class="twocol" style="margin-top:12px"><button class="btn" id="export">⬇️ 下載學習紀錄</button><button class="btn" id="reset">↻ 清除本機紀錄</button></div><p class="footer">資料僅保留在此裝置的瀏覽器，不會自動傳給教師。瀏覽器清除網站資料可能使進度消失，請適時匯出。</p>`}
function studentMission(i){const m=missions[i];return `<div class="eyebrow">MISSION ${String(i+1).padStart(2,'0')} / 07 · ${escapeHTML(m.source)}</div><h1>${m.icon} ${m.name}</h1><p class="muted">${m.sub}</p><div class="panel"><b>📘 觀念補給站</b><p>${escapeHTML(m.concept)}</p></div><div class="task"><b>🧭 學生探究任務</b><div>${escapeHTML(m.task)}</div></div><h2>✍️ 任務反思</h2><textarea id="reflection" placeholder="寫下你的例子、立場、理由或查證結果……">${escapeHTML(store.notes[m.id]||'')}</textarea><h2>🧠 解鎖測驗</h2>${m.questions.map((q,j)=>`<div class="q"><strong>${j+1}. ${escapeHTML(q.q)}</strong>${q.opts.map((opt,k)=>`<label class="choice"><input type="radio" name="q${j}" value="${k}"> ${escapeHTML(opt)}</label>`).join('')}</div>`).join('')}<button class="btn primary" id="check">🔓 檢查答案與解鎖</button><button class="btn" id="back" style="margin-left:7px">← 返回任務地圖</button><div id="feedback">${feedback}</div>${store.done.includes(m.id)?'<div class="feedback ok">✅ 此站已完成，可以前往下一座建築繼續探索。</div>':''}<details><summary>👩‍🏫 學習延伸與法律提醒</summary><p>教材案例為概念化情境。真實爭議涉及事實認定、契約約定、物權變動例外及其他法令，不能只靠本測驗判定法律責任。</p></details>`}
